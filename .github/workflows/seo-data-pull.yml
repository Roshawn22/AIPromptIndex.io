name: SEO Data Pull

on:
  schedule:
    # Both crons target 07:00 America/Los_Angeles year-round. The schedule-
    # identity gate below selects the PDT or PST cron without depending on
    # the time GitHub actually starts the job.
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-data-pull-main
  cancel-in-progress: false

jobs:
  data-pull:
    name: Pull SEO Data (GSC + GA4 + OpenSEO)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select Pacific-time cron by schedule identity
        id: gate
        shell: bash
        env:
          TRIGGERING_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run_pull=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch detected. Proceeding."
            exit 0
          fi

          pacific_offset="$(TZ=America/Los_Angeles date +%z)"
          echo "Schedule identity: cron=${TRIGGERING_SCHEDULE} pacific_offset=${pacific_offset}"

          case "${pacific_offset}:${TRIGGERING_SCHEDULE}" in
            "-0700:0 14 * * *"|"-0800:0 15 * * *")
              echo "run_pull=true" >> "$GITHUB_OUTPUT"
              echo "Selected cron matched the current Pacific offset."
              ;;
            *)
              echo "run_pull=false" >> "$GITHUB_OUTPUT"
              echo "Duplicate DST cron skipped."
              ;;
          esac

      - name: Preflight verification
        if: steps.gate.outputs.run_pull == 'true'
        env:
          DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
          OPENSEO_API_KEY: ${{ secrets.OPENSEO_API_KEY }}
          SEO_ENABLE_AHREFS: "false"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_ANALYTICS_PROPERTY_ID: ${{ secrets.GOOGLE_ANALYTICS_PROPERTY_ID }}
          GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_AHREFS_SITE_VERIFICATION: ${{ secrets.PUBLIC_AHREFS_SITE_VERIFICATION }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: npm run seo:verify:setup

      - name: Resolve workflow gates from setup verification
        if: steps.gate.outputs.run_pull == 'true'
        id: preflight
        shell: bash
        run: |
          verification_file="$(find output/seo -name setup-verification.json | sort | tail -n 1)"
          if [[ -z "$verification_file" ]]; then
            echo "setup-verification.json not found"
            exit 1
          fi
          echo "verification_file=$verification_file" >> "$GITHUB_OUTPUT"
          VERIFICATION_FILE="$verification_file" node --input-type=module - <<'EOF' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const filePath = process.env.VERIFICATION_FILE;
          const report = JSON.parse(fs.readFileSync(filePath, 'utf8'));
          const gates = report.summary.workflowGates || {};
          console.log(`can_run_first_party=${gates.canRunFirstParty !== false}`);
          console.log(`can_run_openseo=${gates.canRunOpenSeo === true}`);
          console.log(`can_run_ahrefs=${gates.canRunAhrefs === true}`);
          console.log(`blocked_endpoints=${(report.summary.blockedEndpoints || []).join(',')}`);
          console.log(`overall_status=${report.summary.overallStatus}`);
          EOF

      - name: Pull GSC data
        id: pull_gsc
        if: steps.gate.outputs.run_pull == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
        run: npm run seo:pull:gsc

      - name: Pull GA4 data
        if: steps.gate.outputs.run_pull == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_ANALYTICS_PROPERTY_ID: ${{ secrets.GOOGLE_ANALYTICS_PROPERTY_ID }}
        run: npm run seo:pull:ga4
        continue-on-error: true

      - name: Pull OpenSEO data
        id: pull_openseo
        if: steps.gate.outputs.run_pull == 'true' && steps.preflight.outputs.can_run_openseo == 'true'
        env:
          DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
          OPENSEO_API_KEY: ${{ secrets.OPENSEO_API_KEY }}
        run: npm run seo:pull:openseo
        continue-on-error: true

      - name: Generate content briefs
        if: steps.gate.outputs.run_pull == 'true' && steps.pull_gsc.outcome == 'success'
        run: npm run seo:content-briefs
        continue-on-error: true

      - name: Analyze AI visibility
        if: steps.gate.outputs.run_pull == 'true'
        run: npm run seo:ai-visibility
        continue-on-error: true

      - name: Keyword gap analysis
        if: steps.gate.outputs.run_pull == 'true'
        run: npm run seo:keyword-gaps
        continue-on-error: true

      - name: Suggest rank tracker keywords
        if: steps.gate.outputs.run_pull == 'true'
        run: npm run seo:rank-suggestions
        continue-on-error: true

      - name: Generate SEO brief
        if: steps.gate.outputs.run_pull == 'true' && steps.pull_gsc.outcome == 'success'
        run: npm run seo:brief

      - name: Upload SEO output
        if: always() && steps.gate.outputs.run_pull == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seo-data-pull-${{ github.run_id }}
          path: output/seo/
          if-no-files-found: error

      - name: Open or update blocked SEO endpoint issue
        if: steps.gate.outputs.run_pull == 'true' && steps.preflight.outputs.blocked_endpoints != ''
        uses: actions/github-script@v7
        env:
          BLOCKED_ENDPOINTS: ${{ steps.preflight.outputs.blocked_endpoints }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_AT: ${{ github.run_started_at }}
        with:
          script: |
            const title = 'SEO API Endpoint Blocked';
            const blocked = [...new Set(process.env.BLOCKED_ENDPOINTS.split(',').filter(Boolean))];
            if (blocked.length === 0 || blocked.every((name) => name.startsWith('ahrefs.'))) {
              return;
            }
            const body = [
              'One or more SEO API surfaces are blocked in the scheduled automation.',
              '',
              `- Blocked endpoints: ${blocked.join(', ')}`,
              `- First observed in this run: ${process.env.RUN_AT}`,
              `- Run: ${process.env.RUN_URL}`,
              '',
              'Ahrefs is no longer the default data source. This issue now tracks OpenSEO/DataForSEO or other remaining blocked APIs.'
            ].join('\n');

            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Blocked endpoints observed again: ${blocked.join(', ')} (${process.env.RUN_URL})`
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Open or update SEO data pull failure issue
        if: failure() && steps.gate.outputs.run_pull == 'true'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_AT: ${{ github.run_started_at }}
          ARTIFACT_NAME: seo-data-pull-${{ github.run_id }}
        with:
          script: |
            const title = 'SEO Data Pull Failure';
            const body = [
              'The scheduled SEO data pull failed.',
              '',
              `- Run: ${process.env.RUN_URL}`,
              `- Triggered at: ${process.env.RUN_AT}`,
              `- Workflow artifact: \`${process.env.ARTIFACT_NAME}\` in the linked run`,
              '',
              'This issue stays open until a later `SEO Data Pull` run passes.'
            ].join('\n');

            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Another failure was detected: ${process.env.RUN_URL}`
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }

      - name: Close SEO data pull failure issue on recovery
        if: success() && steps.gate.outputs.run_pull == 'true'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = 'SEO Data Pull Failure';
            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = openIssues.find((issue) => issue.title === title);

            if (!existing) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Recovered in ${process.env.RUN_URL}`
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: 'closed'
            });

      - name: Close leftover Ahrefs blocked-endpoint issue
        if: success() && steps.gate.outputs.run_pull == 'true'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = 'SEO API Endpoint Blocked';
            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (!existing) return;
            const body = existing.body || '';
            const onlyAhrefs = /ahrefs\.api/i.test(body) && !/openseo/i.test(body);
            if (!onlyAhrefs) return;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Closing leftover Ahrefs-blocked issue. Daily jobs now pull GSC/GA4 and OpenSEO instead of Ahrefs (${process.env.RUN_URL}).`
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: 'closed'
            });

      - name: Gated run summary
        if: steps.gate.outputs.run_pull == 'false'
        run: echo "Skipped by Pacific-time gate."
