name: Production Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Convex then Vercel
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm revision is still current
        id: release_guard
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale production release $RELEASE_SHA; main is $current_main."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.release_guard.outputs.deploy == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.release_guard.outputs.deploy == 'true'
        run: npm ci

      - name: Pull Vercel production configuration
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          VERCEL_ORG_ID: team_6VWJy7KBNXcjeX8KGlpzCHyw
          VERCEL_PROJECT_ID: prj_hH4nx1BfajNTl5MQ79hgFjZ2RhKK
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi
          npx --yes vercel@50.42.0 pull \
            --yes \
            --environment=production \
            --scope roshawnfranklin-gmailcoms-projects

      - name: Verify production frontend configuration
        if: steps.release_guard.outputs.deploy == 'true'
        run: |
          if ! grep -Eq '^PUBLIC_CONVEX_URL="?https://quick-wolf-789\.convex\.cloud"?$' .vercel/.env.production.local; then
            echo "::error::Vercel production is not configured for the quick-wolf-789 Convex deployment."
            exit 1
          fi

      - name: Build the validated frontend revision
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          VERCEL_ORG_ID: team_6VWJy7KBNXcjeX8KGlpzCHyw
          VERCEL_PROJECT_ID: prj_hH4nx1BfajNTl5MQ79hgFjZ2RhKK
        run: npx --yes vercel@50.42.0 build --prod

      - name: Deploy Convex production
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not configured."
            exit 1
          fi
          npx convex deploy --typecheck enable --codegen enable

      - name: Deploy the matching frontend revision
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          VERCEL_ORG_ID: team_6VWJy7KBNXcjeX8KGlpzCHyw
          VERCEL_PROJECT_ID: prj_hH4nx1BfajNTl5MQ79hgFjZ2RhKK
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi
          npx --yes vercel@50.42.0 deploy \
            --prebuilt \
            --prod \
            --yes \
            --scope roshawnfranklin-gmailcoms-projects

      - name: Smoke-test canonical production URL
        if: steps.release_guard.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 15 \
            --output /dev/null \
            https://aipromptindex.io/
