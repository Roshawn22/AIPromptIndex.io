name: Production Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Convex then Vercel
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm revision is still current
        id: release_guard
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale production release $RELEASE_SHA; main is $current_main."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.release_guard.outputs.deploy == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.release_guard.outputs.deploy == 'true'
        run: npm ci

      - name: Deploy Convex production
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not configured."
            exit 1
          fi
          npx convex deploy --typecheck enable --codegen enable

      - name: Deploy the matching frontend revision
        if: steps.release_guard.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const teamId = "team_6VWJy7KBNXcjeX8KGlpzCHyw";
          const projectId = "prj_hH4nx1BfajNTl5MQ79hgFjZ2RhKK";
          const releaseSha = process.env.RELEASE_SHA;
          const headers = {
            Authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
            "Content-Type": "application/json",
          };

          const createResponse = await fetch(
            `https://api.vercel.com/v13/deployments?teamId=${teamId}&forceNew=1`,
            {
              method: "POST",
              headers,
              body: JSON.stringify({
                name: "aipromptindex",
                project: projectId,
                target: "production",
                gitSource: {
                  type: "github",
                  repoId: 1199962728,
                  ref: "main",
                  sha: releaseSha,
                },
                gitMetadata: {
                  commitRef: "main",
                  commitSha: releaseSha,
                  ci: true,
                  ciType: "github-actions",
                },
                meta: {
                  githubCommitSha: releaseSha,
                  releaseWorkflow: "production-release",
                },
              }),
            },
          );

          const created = await createResponse.json();
          if (!createResponse.ok || !created.id) {
            throw new Error(
              `Vercel deployment creation failed (${createResponse.status}): ${created.error?.message ?? "unknown error"}`,
            );
          }

          console.log(`Vercel accepted production deployment ${created.id} for ${releaseSha}.`);
          const terminalFailures = new Set(["BLOCKED", "CANCELED", "ERROR"]);

          for (let attempt = 1; attempt <= 90; attempt += 1) {
            const statusResponse = await fetch(
              `https://api.vercel.com/v13/deployments/${created.id}?teamId=${teamId}&withGitRepoInfo=true`,
              { headers },
            );
            const deployment = await statusResponse.json();
            if (!statusResponse.ok) {
              throw new Error(
                `Vercel deployment status failed (${statusResponse.status}): ${deployment.error?.message ?? "unknown error"}`,
              );
            }
            if (terminalFailures.has(deployment.readyState)) {
              throw new Error(
                `Vercel deployment ${created.id} ended in ${deployment.readyState}: ${deployment.errorMessage ?? deployment.aliasError?.message ?? "no error message"}`,
              );
            }
            if (deployment.readyState === "READY" && deployment.aliasAssigned) {
              if (deployment.target !== "production") {
                throw new Error(`Vercel deployment ${created.id} did not target production.`);
              }
              if (deployment.gitSource?.sha !== releaseSha) {
                throw new Error(
                  `Vercel deployed ${deployment.gitSource?.sha ?? "an unknown SHA"}; expected ${releaseSha}.`,
                );
              }
              console.log(`Vercel production deployment is ready: https://${deployment.url}`);
              process.exit(0);
            }

            console.log(
              `Waiting for Vercel deployment ${created.id} (${deployment.readyState}, ${attempt}/90)...`,
            );
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }

          throw new Error(`Timed out waiting for Vercel deployment ${created.id}.`);
          NODE

      - name: Smoke-test canonical production URL
        if: steps.release_guard.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 15 \
            --output /dev/null \
            https://aipromptindex.io/
